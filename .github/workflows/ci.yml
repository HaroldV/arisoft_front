name: Frontend Quality Gates & CI

on:
  push:
    branches: [ develop, main, "feature/**" ]
  pull_request:
    branches: [ develop, main ]

jobs:
  quality-gates:
    name: Frontend Clean Code, Lint & Build Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: "Setup Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: "Install Dependencies"
        run: npm install

      - name: "Quality Gate 1: Architecture Guard (No String Field Dispatchers - Rule 11.5)"
        run: |
          echo "🔍 Checking for prohibited handleItemChange with string field comparisons (Rule 11.5)..."
          FORBIDDEN_MUTATORS=$(grep -rn --include="*.ts" --include="*.tsx" "field === '" src/ || true)
          if [ -n "$FORBIDDEN_MUTATORS" ]; then
            echo "❌ Architecture Quality Gate Failed: String-based field comparators found:"
            echo "$FORBIDDEN_MUTATORS"
            echo "👉 Rule 11.5 of AGENTS.md strictly prohibits string dispatchers. Use Partial<T> mutators."
            exit 1
          fi
          echo "✅ Strict Frontend Architecture Guard Passed."

      - name: "Quality Gate 2: ESLint & Strict Typecheck"
        run: npm run lint

      - name: "Quality Gate 3: Production Turbopack Build"
        run: npm run build
